spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 2147483647
      batch-size: 32768
      compression-type: lz4
      properties:
        enable.idempotence: true
        max.block.ms: 100
        max.in.flight.requests.per.connection: 5
        linger.ms: 20
    consumer:
      group-id: ad-click-aggregation
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.adclick.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.adclick.aggregation.message.ClickEventMessage
        max.poll.records: 100
    listener:
      type: batch
      ack-mode: manual

adclick:
  kafka:
    topics:
      auto-create-enabled: false
      partitions: 3
      replicas: 1
      click-events: ad-click-events
      click-events-dlt: ad-click-events-dlt
    consumer:
      dlt:
        retry-interval-ms: 1000
        max-attempts: 3
    outbox:
      relay:
        enabled: true
        fixed-delay-ms: 1000
        publish-timeout-ms: 1000
        batch-size: 100
        processing-timeout-seconds: 300
        retry:
          initial-interval-ms: 1000
          multiplier: 2.0
          max-interval-ms: 60000
          max-attempts: 10
