spring:
  application:
    name: ad-click-api

  datasource:
    url: jdbc:mysql://localhost:3306/adclick?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: adclick
    password: adclick
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
