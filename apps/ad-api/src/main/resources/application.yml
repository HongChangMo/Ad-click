spring:
  config:
    import: classpath:application-kafka.yml

  application:
    name: ad-click-api

  datasource:
    url: jdbc:mysql://localhost:3306/adclick?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: adclick
    password: adclick
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

adclick:
  click:
    reconciliation:
      runner:
        enabled: false
        fixed-delay-ms: 60000
        window-minutes: 10
        lag-seconds: 30
        lock-ttl-seconds: 300
  valkey:
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 5
      minimum-number-of-calls: 5
      wait-duration-in-open-state-ms: 10000
      permitted-half-open-calls: 2
    retry:
      max-attempts: 2
      initial-interval-ms: 50
      multiplier: 2.0
      max-interval-ms: 200
