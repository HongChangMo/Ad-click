spring:
  application:
    name: ad-click-api

  datasource:
    url: jdbc:mysql://localhost:3306/adclick?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: adclick
    password: adclick
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.block.ms: 100
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ad-click-aggregation
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.adclick.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.adclick.aggregation.message.ClickEventMessage
    listener:
      ack-mode: manual

server:
  port: 8080

adclick:
  kafka:
    topics:
      click-events: ad-click-events
  click:
    reconciliation:
      runner:
        enabled: false
        fixed-delay-ms: 60000
        window-minutes: 10
        lag-seconds: 30
        lock-ttl-seconds: 300
  valkey:
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 5
      minimum-number-of-calls: 5
      wait-duration-in-open-state-ms: 10000
      permitted-half-open-calls: 2
    retry:
      max-attempts: 2
      initial-interval-ms: 50
      multiplier: 2.0
      max-interval-ms: 200
